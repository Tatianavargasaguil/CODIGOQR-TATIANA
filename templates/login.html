<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <style>
        body {font-family:'Segoe UI',Tahua, Geneva, Verdana, sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;background:#f0f4ff;}
        .login-box{background:white;padding:30px;border-radius:12px;box-shadow:0 5px 20px rgba(0,0,0,0.1);max-width:320px;width:100%;}
        h2{text-align:center;margin-bottom:20px;color:#333;}
        .form-group{margin-bottom:15px;}
        label{display:block;font-weight:600;margin-bottom:5px;}
        input[type="text"],input[type="password"]{width:100%;padding:10px;border:2px solid #ddd;border-radius:6px;font-size:16px;}
        button{width:100%;padding:10px;background:#667eea;color:white;border:none;border-radius:6px;font-size:16px;cursor:pointer;}
        .error{color:#cb2431;margin-bottom:10px;text-align:center;}
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Inicio de sesión</h2>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post" action="/login">
            <div class="form-group">
                <label>Usuario</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit">Entrar</button>
        </form>
    </div>
</body>
</html>
